[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godhome-rl"
version = "0.1.0"
description = "A reinforcement-learning agent that learns to play the Godhome mod (Hollow Knight bosses) for Deltarune/Kristal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GodhomeRL contributors" }]
keywords = ["reinforcement-learning", "ppo", "hollow-knight", "godot", "love2d", "bullet-hell", "deltarune", "kristal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Lua",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
# Offline Lua syntax checking for the harness (no game boot required).
dev = [
  "lupa>=2.0",
  "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/your-org/godhome-rl"
Repository = "https://github.com/your-org/godhome-rl"
Issues = "https://github.com/your-org/godhome-rl/issues"

[project.scripts]
godhome-rl = "godhome_rl.cli:main"

[tool.setuptools]
packages = ["godhome_rl", "godhome_rl.env", "godhome_rl.rl", "tools"]

[tool.setuptools.package-data]
"*" = ["*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"